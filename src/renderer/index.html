<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <title>Lyno AIO Provider Assistant</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="style-extras.css">
</head>
<body>
  <!-- Aurora background layers -->
  <div class="aurora-bg">
    <canvas id="starfield"></canvas>
    <div class="aurora-wave w1"></div>
    <div class="aurora-wave w2"></div>
    <div class="aurora-wave w3"></div>
  </div>

  <div id="app">
    <!-- Titlebar + window controls cùng 1 hàng -->
    <header class="titlebar">
      <div class="tb-brand">
        <div class="tb-logo">
          <svg viewBox="0 0 32 32" width="22" height="22" fill="none">
            <defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0" stop-color="#00FF87"/><stop offset="1" stop-color="#00D4FF"/>
            </linearGradient></defs>
            <rect x="3" y="3" width="26" height="26" rx="7" fill="url(#lg)"/>
            <path d="M11 10v12M11 22h9" stroke="#050B1A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="tb-name">Lyno AIO</span>
      </div>
      <nav class="tb-tabs">
        <button class="tab active" data-view="tools">Công cụ</button>
        <button class="tab" data-view="presets">Preset</button>
      </nav>
      <div class="tb-search">
        <svg viewBox="0 0 20 20" width="14" height="14"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14 14l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="global-search" placeholder="Tìm provider, model, URL...">
      </div>
      <div class="tb-meta">
        <span class="tb-chip"><i class="dot ok"></i><span id="tb-configured">0</span></span>
      </div>
      <div class="wc-buttons">
        <button class="wc-btn wc-min" id="wc-min"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button class="wc-btn wc-max" id="wc-max"><svg viewBox="0 0 12 12" width="12" height="12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button class="wc-btn wc-close" id="wc-close"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2"/></svg></button>
      </div>
    </header>

    <div class="workspace">
      <aside class="rail" id="rail"></aside>
      <main class="pane" id="pane"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="debug-boot.js"></script>
  <script src="gsap.min.js"></script>
  <script src="logos.js"></script>
  <script src="modal-fields.js"></script>
  <script src="modal-payload.js"></script>
  <script src="modal-wire.js"></script>
  <script src="modal.js"></script>
  <script src="preset-view.js"></script>
  <script src="app.js"></script>
</body>
</html>
