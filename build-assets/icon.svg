<!-- Logo Lyno AIO Provider Assistant -->
<!-- Concept: vong tron aurora gradient + chu L cach dieu + 3 cham dai dien cho 7 tools -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256">
      <stop offset="0" stop-color="#0A1628"/>
      <stop offset="1" stop-color="#050B1A"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="256" y2="256">
      <stop offset="0" stop-color="#00FF87"/>
      <stop offset="0.5" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#FF6EC7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- Outer aurora ring -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="url(#aurora)" stroke-width="2.5" opacity="0.7"/>
  <circle cx="128" cy="128" r="78" fill="none" stroke="url(#aurora)" stroke-width="1.5" opacity="0.35"/>
  <!-- Glow center -->
  <circle cx="128" cy="128" r="60" fill="url(#glow)"/>
  <!-- Letter L stylized -->
  <path d="M96 70 L96 168 L168 168" fill="none" stroke="url(#aurora)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 3 dots representing connected tools/providers -->
  <circle cx="180" cy="76" r="8" fill="#00FF87"/>
  <circle cx="76" cy="180" r="8" fill="#FF6EC7"/>
  <circle cx="180" cy="180" r="8" fill="#00D4FF"/>
  <!-- Connection lines (subtle) -->
  <path d="M96 70 L180 76 M168 168 L180 180 M168 168 L76 180" stroke="url(#aurora)" stroke-width="1.5" opacity="0.4" stroke-linecap="round" fill="none"/>
</svg>
